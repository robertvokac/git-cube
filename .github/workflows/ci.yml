name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            cc: gcc
            cxx: g++
            build_type: Debug
          - name: GCC Release
            cc: gcc
            cxx: g++
            build_type: Release
          - name: Clang Debug
            cc: clang
            cxx: clang++
            build_type: Debug
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev git zip curl
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DGITCUBE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2
      - name: Verify install layout
        if: matrix.build_type == 'Release'
        env:
          DESTDIR: ${{ runner.temp }}/gitcube-stage
        run: |
          cmake --install build
          test -x "${DESTDIR}/usr/local/bin/gitcube"
          test -f "${DESTDIR}/usr/local/share/systemd/user/gitcube.service"
          test -f "${DESTDIR}/usr/local/share/doc/gitcube/LICENSE"
      - name: Build release archive
        if: matrix.build_type == 'Release'
        run: cpack --config build/CPackConfig.cmake -G TGZ
      - uses: actions/upload-artifact@v4
        if: matrix.build_type == 'Release'
        with:
          name: gitcube-release-archive
          path: gitcube-*.tar.gz
          if-no-files-found: error

  static-analysis:
    name: Cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Analyze
        run: >
          cppcheck
          --enable=warning,performance,portability
          --std=c++20
          --error-exitcode=1
          --suppress=missingIncludeSystem
          --suppress=normalCheckLevelMaxBranches
          -Isrc
          src tests

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev git zip curl
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGITCUBE_WARNINGS_AS_ERRORS=ON
          -DGITCUBE_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev git zip curl gcovr
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGITCUBE_WARNINGS_AS_ERRORS=ON
          -DGITCUBE_ENABLE_COVERAGE=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Report coverage
        run: >
          gcovr --root .
          --filter '${{ github.workspace }}/src/'
          --exclude '${{ github.workspace }}/src/main.cpp'
          --txt
          --fail-under-line 30
      - name: Write coverage artifact
        run: >
          gcovr --root .
          --filter '${{ github.workspace }}/src/'
          --exclude '${{ github.workspace }}/src/main.cpp'
          --xml-pretty
          --output coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
